# ── Shared env snippet ─────────────────────────────────────────────────────────
x-kafka-env: &kafka-env
  KAFKA_BROKER:  ${KAFKA_BROKER:-163.47.8.3:9094}
  KAFKA_BROKERS: ${KAFKA_BROKER:-163.47.8.3:9094}
  KAFKA_USER:    ${KAFKA_USER:-user1}
  KAFKA_PASS:    ${KAFKA_PASS:-QA7aKGtPHV}

# Kafka returns "controller.internal" as its advertised listener hostname.
# This maps it to the broker's public IP so containers can reach it.
x-extra-hosts: &extra-hosts
  extra_hosts:
    - "controller.internal:163.47.8.3"

services:

  # ── F3: Collection Workflow Orchestrator ───────────────────────────────────
  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: f3-orchestrator
    restart: unless-stopped
    environment:
      <<: *kafka-env
      PORT: 3001
      BIN_STATUS_URL:   http://bin-status:3002
      SCHEDULER_URL:    http://scheduler:3003
      NOTIFICATION_URL: http://notification:3004
    <<: *extra-hosts
    expose:
      - "3001"
    networks:
      - garabadge
    depends_on:
      bin-status:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── F3: Bin Status Service ─────────────────────────────────────────────────
  bin-status:
    build:
      context: ./backend/bin-status
      dockerfile: Dockerfile
    container_name: f3-bin-status
    restart: unless-stopped
    environment:
      <<: *kafka-env
      PORT: 3002
    <<: *extra-hosts
    ports:
      - "3002:3002"   # exposed for browser → Socket.IO direct connection
    networks:
      - garabadge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── F3: Scheduler Service ──────────────────────────────────────────────────
  scheduler:
    build:
      context: ./backend/scheduler
      dockerfile: Dockerfile
    container_name: f3-scheduler
    restart: unless-stopped
    environment:
      <<: *kafka-env
      PORT: 3003
    <<: *extra-hosts
    expose:
      - "3003"
    networks:
      - garabadge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── F3: Notification Service (Socket.IO hub) ───────────────────────────────
  notification:
    build:
      context: ./backend/notification
      dockerfile: Dockerfile
    container_name: f3-notification
    restart: unless-stopped
    environment:
      <<: *kafka-env
      PORT: 3004
    <<: *extra-hosts
    expose:
      - "3004"
    networks:
      - garabadge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Telemetry bridge (Python) ──────────────────────────────────────────────
  telemetry-bridge:
    build:
      context: ./telemetry-bridge
      dockerfile: Dockerfile
    container_name: f3-telemetry-bridge
    restart: unless-stopped
    environment:
      <<: *kafka-env
      BIN_STATUS_URL:   http://bin-status:3002
      NOTIFICATION_URL: http://notification:3004
    <<: *extra-hosts
    depends_on:
      bin-status:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks:
      - garabadge

  # ── Kafka Simulator ────────────────────────────────────────────────────────
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: garabadge-simulator
    restart: unless-stopped
    environment:
      <<: *kafka-env
    depends_on:
      bin-status:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks:
      - garabadge

  # ── Next.js dashboard ──────────────────────────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garabadge-nextjs
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - garabadge

  # ── Kong API Gateway (DB-less) ─────────────────────────────────────────────
  kong:
    image: kong:3.7
    container_name: garabadge-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE:           "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG:   /dev/stdout
      KONG_ADMIN_ACCESS_LOG:   /dev/stdout
      KONG_PROXY_ERROR_LOG:    /dev/stderr
      KONG_ADMIN_ERROR_LOG:    /dev/stderr
      KONG_ADMIN_LISTEN:       "0.0.0.0:8001"
    ports:
      - "8000:8000"   # public API + notification Socket.IO
      - "8001:8001"   # Kong admin
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      orchestrator:
        condition: service_healthy
      bin-status:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      notification:
        condition: service_healthy
      nextjs:
        condition: service_started
    networks:
      - garabadge
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

networks:
  garabadge:
    driver: bridge
